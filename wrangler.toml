name = "gdrive-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Custom Domain Route on Cloudflare
routes = [
  { pattern = "gdrive-api.gnn.tr", custom_domain = true }
]

[vars]
# Optional target folder in Google Drive (Leave blank to upload to root)
GDRIVE_FOLDER_ID = ""

# Optional incident alert channels
DISCORD_WEBHOOK_URL = ""
TELEGRAM_BOT_TOKEN = ""
TELEGRAM_CHAT_ID = ""
